name: Build Cavadas Manager Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf node_modules
          pnpm install --no-frozen-lockfile
          test -x node_modules/.bin/vite
          test -x node_modules/.bin/cap

      - name: Build WebApp
        run: pnpm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f android/gradlew ]; then
            rm -rf android
            ./node_modules/.bin/cap add android
          fi
          ./node_modules/.bin/cap sync android
          test -f android/gradlew

      - name: Apply app icons
        shell: bash
        run: |
          set -e
          if [ -d android-icons/res ]; then
            cp -R android-icons/res/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: Cavadas-Manager-V13.1-APK
          path: android/app/build/outputs/apk/debug/*.apk
